#################
# glauth.conf

#################
# General configuration.
debug = true
# syslog = true
#
# Enable hot-reload of configuration on changes
# - does NOT work [ldap], [ldaps], [backend] or [api] sections
# watchconfig = true

#################
# yubikeyclientid = "yubi-api-clientid"
# yubikeysecret = "yubi-api-secret"

#################
# Server configuration.
[ldap]
  enabled = true
  listen = "0.0.0.0:3893"

[ldaps]
  enabled = false
  listen = "0.0.0.0:3894"
  cert = "certs/server.crt"
  key = "certs/server.key"

#################
# The backend section controls the data store.
#
# This backend exposes a Keycloak realm over LDAP (read-only), primarily so
# that Keycloak can act as an identity provider for vSphere, even without
# LDAP user federation.
#
# LDAP simple binds authenticate either as Keycloak *service accounts* — the
# bind DN "cn=<client-id>,cn=bind,dc=example,dc=com" together with the bind
# password (the client secret) is used for an OAuth 2.0 client credentials
# grant — or as *users*: the bind DN "cn=<username>,cn=users,dc=example,dc=com"
# together with the user's password is validated through a direct access grant
# on the client configured below, and the connection's searches then run as
# that client's service account.
# Users and groups of the realm appear under cn=users,<base> and
# cn=groups,<base> respectively.
[backend]
  datastore = "keycloak"

  # Hostname of the Keycloak server (https only).
  keycloakhostname = "keycloak.example.com"
  # HTTPS port of the Keycloak server (defaults to 8443).
  keycloakport = 443
  # Keycloak realm whose users and groups are exposed.
  keycloakrealm = "master"
  # DNS domain used to derive base DNs and objectSids, e.g. "example.com"
  # results in base DNs below dc=example,dc=com.
  keycloakdomain = "example.com"

  # Confidential client used to validate user password binds (direct access
  # grants must be enabled on it) and to run those connections' searches (its
  # service account needs the realm-management roles view-users, query-users
  # and query-groups). Required for user binds.
  keycloakclientid = "client_id"
  keycloakclientsecret = "client_secret"

#################
# Enable and configure the optional REST API here.
[api]
  enabled = true
  tls = false # enable TLS for production!!
  listen = "0.0.0.0:5555"
  cert = "cert.pem"
  key = "key.pem"
